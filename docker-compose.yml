services:
  web:
    build: .
    container_name: coffee_batch_app
    ports:
      - "5001:5000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-coffee_user}:${POSTGRES_PASSWORD:-coffee_password}@db:5432/${POSTGRES_DB:-coffee_db}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: coffee_batch_database
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coffee_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coffee_password}
      POSTGRES_DB: ${POSTGRES_DB:-coffee_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data: