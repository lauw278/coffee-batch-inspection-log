<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Batch Inspection Log</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f1e9;
            color: #352719;
            margin: 0;
            padding: 25px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        header {
            background: #493323;
            color: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        h1 {
            margin-top: 0;
        }

        .panel {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            resize: vertical;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px 3px;
        }

        .save {
            background: #493323;
            color: white;
        }

        .cancel {
            background: #ddd;
        }

        .edit {
            background: #d9a441;
        }

        .delete {
            background: #b83b32;
            color: white;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #eee6da;
        }

        #message {
            margin: 15px 0;
            font-weight: bold;
        }

        @media (max-width: 650px) {
            body {
                padding: 12px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <header>
        <h1>Coffee Batch Inspection Log</h1>
        <p>Record, monitor and manage coffee batch quality inspections.</p>
    </header>

    <section class="panel">
        <h2>Register Coffee Batch</h2>

        <form id="batchForm">

            <div class="form-grid">

                <div>
                    <label for="batch_code">Batch Code</label>
                    <input id="batch_code" maxlength="30" required>
                </div>

                <div>
                    <label for="coffee_origin">Coffee Origin</label>
                    <input id="coffee_origin" maxlength="120" required>
                </div>

                <div>
                    <label for="processing_method">Processing Method</label>
                    <input id="processing_method" maxlength="80"
                           placeholder="Washed, Natural, Honey..." required>
                </div>

                <div>
                    <label for="inspection_date">Inspection Date</label>
                    <input type="date" id="inspection_date" required>
                </div>

                <div>
                    <label for="quality_status">Quality Status</label>
                    <select id="quality_status" required>
                        <option value="">Select status</option>
                        <option value="Passed">Passed</option>
                        <option value="Needs Review">Needs Review</option>
                        <option value="Failed">Failed</option>
                    </select>
                </div>

                <div>
                    <label for="notes">Inspection Notes</label>
                    <textarea id="notes" rows="3"
                              maxlength="1000"></textarea>
                </div>

            </div>

            <br>

            <button type="submit" class="save" id="submitButton">
                Save Inspection
            </button>

            <button type="button" class="cancel"
                    id="cancelButton" hidden>
                Cancel Edit
            </button>

        </form>

        <div id="message" role="status" aria-live="polite"></div>
    </section>

    <section class="panel">
        <h2>Inspection Records</h2>

        <button type="button" class="cancel" onclick="loadBatches()">
            Refresh Records
        </button>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Batch Code</th>
                        <th>Origin</th>
                        <th>Processing</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Notes</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="batchTable">
                    <tr>
                        <td colspan="8">Loading records...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

</div>

<script>
    const form = document.getElementById("batchForm");
    const table = document.getElementById("batchTable");
    const message = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");
    const cancelButton = document.getElementById("cancelButton");

    let editingId = null;

    function showMessage(text, isError = false) {
        message.textContent = text;
        message.style.color = isError ? "red" : "green";
    }

    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[char]);
    }

    async function loadBatches() {
        try {
            const response = await fetch("/api/batches");

            if (!response.ok) {
                throw new Error("Could not retrieve records");
            }

            const batches = await response.json();

            table.innerHTML = "";

            if (batches.length === 0) {
                table.innerHTML =
                    '<tr><td colspan="8">No inspection records yet.</td></tr>';
                return;
            }

            batches.forEach(batch => {
                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${batch.id}</td>
                    <td>${escapeHTML(batch.batch_code)}</td>
                    <td>${escapeHTML(batch.coffee_origin)}</td>
                    <td>${escapeHTML(batch.processing_method)}</td>
                    <td>${escapeHTML(batch.inspection_date)}</td>
                    <td>${escapeHTML(batch.quality_status)}</td>
                    <td>${escapeHTML(batch.notes)}</td>
                    <td>
                        <button class="edit"
                            onclick="editBatch(${batch.id})">
                            Edit
                        </button>

                        <button class="delete"
                            onclick="deleteBatch(${batch.id})">
                            Delete
                        </button>
                    </td>
                `;

                table.appendChild(row);
            });

        } catch (error) {
            showMessage(error.message, true);
        }
    }

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const data = {
            batch_code: document.getElementById("batch_code").value,
            coffee_origin: document.getElementById("coffee_origin").value,
            processing_method: document.getElementById("processing_method").value,
            inspection_date: document.getElementById("inspection_date").value,
            quality_status: document.getElementById("quality_status").value,
            notes: document.getElementById("notes").value
        };

        const url = editingId
            ? `/api/batches/${editingId}`
            : "/api/batches";

        const method = editingId ? "PUT" : "POST";

        try {
            const response = await fetch(url, {
                method: method,
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || "Operation failed");
            }

            showMessage(result.message || "Record saved successfully");

            resetForm();
            await loadBatches();

        } catch (error) {
            showMessage(error.message, true);
        }
    });

    async function editBatch(id) {
        try {
            const response = await fetch("/api/batches");

            if (!response.ok) {
                throw new Error("Could not retrieve records");
            }

            const batches = await response.json();
            const batch = batches.find(item => item.id === id);

            if (!batch) {
                throw new Error("Batch not found");
            }

            editingId = id;

            document.getElementById("batch_code").value = batch.batch_code;
            document.getElementById("coffee_origin").value = batch.coffee_origin;
            document.getElementById("processing_method").value = batch.processing_method;
            document.getElementById("inspection_date").value = batch.inspection_date;
            document.getElementById("quality_status").value = batch.quality_status;
            document.getElementById("notes").value = batch.notes || "";

            submitButton.textContent = "Update Inspection";
            cancelButton.hidden = false;

            window.scrollTo({ top: 0, behavior: "smooth" });

        } catch (error) {
            showMessage(error.message, true);
        }
    }

    async function deleteBatch(id) {
        if (!confirm("Are you sure you want to delete this record?")) {
            return;
        }

        try {
            const response = await fetch(`/api/batches/${id}`, {
                method: "DELETE"
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || "Could not delete record");
            }

            showMessage(result.message);
            await loadBatches();

        } catch (error) {
            showMessage(error.message, true);
        }
    }

    function resetForm() {
        form.reset();
        editingId = null;
        submitButton.textContent = "Save Inspection";
        cancelButton.hidden = true;
    }

    cancelButton.addEventListener("click", resetForm);

    loadBatches();
</script>

</body>
</html>
